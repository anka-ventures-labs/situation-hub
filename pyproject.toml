[project]
name = "situation-hub"
version = "0.1.0"
description = "Fused home presence and activity for a personal assistant agent, with risk-tiered action guardrails"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "mcp>=1.0",
]

[project.scripts]
situation-hub = "situation_hub.cli:main"
situation-hub-mcp = "situation_hub.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/situation_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
